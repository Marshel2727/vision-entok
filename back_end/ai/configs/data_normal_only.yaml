# Dataset turunan untuk eksperimen deteksi mata normal satu kelas.
# Label normal dari dataset v4 dipetakan dari class ID 1 menjadi class ID 0.
path: "../dataset_sources/normal_only_v4"

train: train/images
val: valid/images
test: test/images

nc: 1
names:
  0: normal

# Gambar sintetis bernomor adalah sampel independen; semua varian .rf dari
# gambar asli yang sama tetap wajib berada pada split yang sama.
split_grouping: original_id
