# Input dari media server lokal, V380Decoder RTSP, MediaMTX, Go2RTC, atau kamera RTSP.
# Jalankan dari folder back_end:
# python ai/webcam_test.py --config ai/configs/media_server_ffmpeg.yaml

model: ../models/best.pt
source_type: ffmpeg

# Ganti URL ini sesuai output media server.
# Contoh V380Decoder yang sempat aktif:
# rtsp://192.168.137.50:8554/live
source: rtsp://127.0.0.1:8554/live

conf: 0.50
imgsz: 640
device: 0

# FFmpeg akan mengubah stream ke raw BGR frame ukuran tetap untuk YOLO.
frame_width: 640
frame_height: 360
ffmpeg_path: ffmpeg
rtsp_transport: tcp
stale_timeout: 5.0
reconnect_delay: 1.0

ffmpeg_input_args:
  - -fflags
  - nobuffer
  - -flags
  - low_delay

window_name: Deteksi Mata Entok - Media Server
show_fps: true
show_window: true

save_abnormal: true
abnormal_label: abnormal
save_interval_seconds: 5
save_dir: ai/runs/detect/abnormal_frames
