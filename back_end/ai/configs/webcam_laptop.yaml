# Config test deteksi dari kamera laptop.
# Jalankan dari folder back_end:
# python ai/webcam_test.py --config ai/configs/webcam_laptop.yaml

model: ../models/best.pt
source_type: opencv
source: 0
conf: 0.50
imgsz: 640
# Gunakan GPU bila tersedia; otomatis fallback ke CPU untuk laptop tanpa GPU.
device: auto
window_name: Deteksi Mata Entok - Kamera Laptop
show_fps: true
show_window: true
save_abnormal: false
